<path d="M204 743 L270 743" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="806" text-anchor="middle" fill="#fbbf24" font-size="17">Shared gate: GM freeze</text>
<path d="M118 822 L118 840" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M396 822 L396 840" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M652 822 L652 840" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
