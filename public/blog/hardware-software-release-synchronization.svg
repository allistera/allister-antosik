<text x="652.0" y="897.0" text-anchor="middle" fill="#e4e4e7" font-size="17">Factory image</text>
<text x="652.0" y="921.0" text-anchor="middle" fill="#e4e4e7" font-size="17">locked</text>
<path d="M204 903 L270 903" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="966" text-anchor="middle" fill="#fbbf24" font-size="17">Shared gate: Launch</text>
<path d="M396 338 L396 382" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M652 338 L652 382" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="1005" text-anchor="middle" fill="#a1a1aa" font-size="14">Sequence is schematic; phases are not equal in duration.</text>
