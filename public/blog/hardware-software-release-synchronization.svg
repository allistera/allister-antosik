<rect x="32" y="870" width="172" height="66" rx="10" fill="#18181b" stroke="#34d399"/>
<text x="118.0" y="909.0" text-anchor="middle" fill="#e4e4e7" font-size="17">MP</text>
<rect x="278" y="870" width="236" height="66" rx="10" fill="#18181b" stroke="#60a5fa"/>
<text x="396.0" y="909.0" text-anchor="middle" fill="#e4e4e7" font-size="17">Day-one OTA</text>
